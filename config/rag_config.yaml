# config/rag_config.yaml
# RAG-specific configuration — extends existing pipeline config

rag:
  enabled: true
  
  corpus:
    sources:
      - "train"          # use training data as corpus
      - "wikipedia"      # optional: pre-downloaded wiki snippets
    chunk_size: 256      # tokens per chunk
    chunk_overlap: 32    # overlap between consecutive chunks
    min_chunk_length: 50 # discard very short chunks
  
  vector_store:
    backend: "faiss"     # faiss | chroma | annoy
    index_type: "IVF"    # Flat | IVF | HNSW
    nlist: 100           # IVF clusters
    nprobe: 10           # IVF search probes
    metric: "cosine"     # cosine | l2
    persist_dir: "outputs/vector_store"
    index_name: "mcq_corpus"
  
  retrieval:
    top_k_values: [3, 5, 10]   # ablation values
    top_k_default: 5
    score_threshold: 0.0        # minimum similarity score
    rerank: false               # cross-encoder reranking (optional)
  
  prompt:
    template_version: "v2"      # v1=basic, v2=chain-of-thought
    max_context_tokens: 512
    include_reasoning: true
  
  model:
    name: "google/flan-t5-large"   # fits T4 GPU
    device: "cuda"
    max_new_tokens: 64
    batch_size: 8
    use_fp16: true
  
  ensemble:
    rag_weight: 0.40
    existing_weight: 0.60
  
  wandb:
    project: "smart-mcq-rag"
    tags: ["rag", "faiss", "flan-t5", "map@3"]